name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-24.04

    steps:
      - run: df -h
      - name: Maximize build space
        run: |
          env | sort
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/az
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/julia*
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /opt/microsoft /opt/google
          sudo docker image prune --all --force
          sudo rm -Rf ${JAVA_HOME_8_X64}
          sudo rm -Rf ${JAVA_HOME_11_X64}
          sudo rm -Rf ${JAVA_HOME_17_X64}
          sudo rm -Rf ${JAVA_HOME_21_X64}
          sudo rm -Rf ${JAVA_HOME_25_X64}
          sudo rm -Rf ${RUBY_PATH}
          sudo rm -Rf ${SWIFT_PATH}
          sudo rm -Rf ${GRADLE_HOME}

          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/Ruby
          sudo rm -rf /opt/hostedtoolcache/Java
          sudo rm -rf /opt/hostedtoolcache/Python
          sudo rm -rf /opt/hostedtoolcache/sbt
          sudo rm -rf /opt/hostedtoolcache/stack
          sudo rm -rf /opt/hostedtoolcache/lein
          sudo rm -rf /opt/pipx
          sudo rm -rf /var/lib/mysql
          sudo rm -rf /var/lib/redis
          sudo rm -rf /var/cache/apt
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/share/terraform
          sudo rm -rf /usr/local/share/helm
          sudo rm -rf /usr/local/share/kubectl
          sudo rm -rf /var/lib/snapd
          sudo rm -rf /usr/local/share/pip-cache
          sudo rm -rf /usr/share/man
          sudo rm -rf /usr/share/doc

          du -sh /usr/local/* 2>/dev/null | sort -rh | head -10
          du -sh /opt/hostedtoolcache/* 2>/dev/null | sort -rh
          du -sh /opt/runner-cache/* 2>/dev/null | sort -rh

      - run: df -h
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
